<section id="contact" class="reveal">
    <div class="section-title">
        <h2>Contact Me</h2>
        <p>Mari diskusikan project menarik berikutnya</p>
    </div>
    <div class="contact-container">
        <div class="contact-info">
            <h3>Informasi Kontak</h3>
            <div class="contact-item">
                <span>📍</span>
                <p>Bangkalan, Jawa Timur, Indonesia</p>
            </div>
            <div class="contact-item">
                <span>✉️</span>
                <p>habibieagain@gmail.com</p>
            </div>
            <div class="contact-item">
                <span>📞</span>
                <p>+62 812 3456 7890 (fake nomor hehe :D)</p>
            </div>
            <div class="contact-item">
                <span>⏱️</span>
                <p>Sesuai Mood saya :p</p>
            </div>
        </div>
        <form class="contact-form" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="name">NAMA LENGKAP</label>
                <input type="text" id="name" placeholder="Masukkan nama Anda..." required>
            </div>
            <div class="form-group">
                <label for="email">ALAMAT EMAIL</label>
                <input type="email" id="email" placeholder="Masukkan email Anda..." required>
            </div>
            <div class="form-group">
                <label for="message">PESAN / PROYEK</label>
                <textarea id="message" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">KIRIM PESAN</button>
        </form>
    </div>
</section>
